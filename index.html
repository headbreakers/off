<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Groupe Motard – Connexion</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage">
    <!-- Lampe sur pied + tirette -->
    <section class="lamp-area" aria-label="Lampe">
      <button class="lamp" id="lampBtn" type="button" aria-pressed="false" aria-label="Allumer / éteindre la lampe">
        <span class="lamp__shade" aria-hidden="true"></span>
        <span class="lamp__stem" aria-hidden="true"></span>
        <span class="lamp__base" aria-hidden="true"></span>

        <!-- Corde / chaînette -->
        <span class="lamp__chain" aria-hidden="true"></span>
        <span class="lamp__knob" aria-hidden="true"></span>

        <span class="lamp__hint">Tire la corde</span>
      </button>
    </section>

    <!-- Connexion (cachée au début) -->
    <section class="login-wrap" id="loginWrap" aria-hidden="true">
      <div class="login-box" id="loginBox">
        <h1>Head Breakers</h1>

        <label class="field">
          <span class="field__label">Username</span>
          <input type="text" id="pseudo" placeholder="Pseudo" autocomplete="username" />
        </label>

        <label class="field">
          <span class="field__label">Password</span>
          <input type="password" id="password" placeholder="Mot de passe" autocomplete="current-password" />
        </label>

        <button class="login-btn" type="button" id="loginBtn">Sign In</button>
        <div class="footer">Groupe motard – privé</div>
      </div>
    </section>
  </main>

  <script>
    const lampBtn = document.getElementById('lampBtn');
    const loginWrap = document.getElementById('loginWrap');
    const loginBtn = document.getElementById('loginBtn');

    function setLamp(on) {
      document.documentElement.classList.toggle('lamp-on', on);
      lampBtn.setAttribute('aria-pressed', String(on));
      loginWrap.setAttribute('aria-hidden', String(!on));

      if (on) setTimeout(() => document.getElementById('pseudo').focus(), 220);
    }

    // Clic sur la lampe (et donc la tirette)
    lampBtn.addEventListener('click', () => {
      const isOn = document.documentElement.classList.contains('lamp-on');
      setLamp(!isOn);
    });

    loginBtn.addEventListener('click', () => {
      const pseudo = document.getElementById('pseudo').value.trim();
      const password = document.getElementById('password').value;

      if (!pseudo || !password) {
        alert('Remplis le pseudo et le mot de passe.');
        return;
      }

      // TODO: brancher une vraie auth (serveur / API)
      alert(`Bienvenue ${pseudo} !`);
    });

    // Par défaut: éteint
    setLamp(false);
  </script>
</body>
</html>
