<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Groupe Motard – Connexion</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage">
    <!-- Lampe avec corde (interrupteur) -->
    <div class="lamp" aria-hidden="false">
      <div class="lamp__ceiling" aria-hidden="true"></div>
      <div class="lamp__cable" aria-hidden="true"></div>
      <div class="lamp__shade" aria-hidden="true"></div>
      <div class="lamp__bulb" aria-hidden="true"></div>

      <!-- Corde cliquable -->
      <button class="lamp__pull" id="lampBtn" type="button" aria-pressed="false" aria-label="Tirer sur la corde pour allumer">
        <span class="lamp__rope" aria-hidden="true"></span>
        <span class="lamp__handle" aria-hidden="true"></span>
        <span class="lamp__hint">Tire la corde</span>
      </button>
    </div>

    <!-- Connexion (cachée au début) -->
    <section class="login-wrap" id="loginWrap" aria-hidden="true">
      <div class="login-box" id="loginBox">
        <h1>Connexion Motard</h1>
        <label class="sr-only" for="pseudo">Pseudo</label>
        <input type="text" id="pseudo" placeholder="Pseudo" autocomplete="username" />

        <label class="sr-only" for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="Mot de passe" autocomplete="current-password" />

        <button class="login-btn" type="button" id="loginBtn">Se connecter</button>
        <div class="footer">Groupe motard – privé</div>
      </div>
    </section>
  </main>

  <script>
    const lampBtn = document.getElementById('lampBtn');
    const loginWrap = document.getElementById('loginWrap');
    const loginBtn = document.getElementById('loginBtn');

    function setLamp(on) {
      document.documentElement.classList.toggle('lamp-on', on);
      lampBtn.setAttribute('aria-pressed', String(on));
      loginWrap.setAttribute('aria-hidden', String(!on));

      if (on) {
        // petit délai pour laisser l'anim se lancer, puis focus
        setTimeout(() => document.getElementById('pseudo').focus(), 250);
      }
    }

    lampBtn.addEventListener('click', () => {
      const isOn = document.documentElement.classList.contains('lamp-on');
      setLamp(!isOn);
    });

    loginBtn.addEventListener('click', () => {
      const pseudo = document.getElementById('pseudo').value.trim();
      const password = document.getElementById('password').value;

      if (!pseudo || !password) {
        alert('Remplis le pseudo et le mot de passe.');
        return;
      }

      // TODO: Ici tu brancheras une vraie auth (serveur / API).
      alert(`Bienvenue ${pseudo} !`);
    });

    // Par défaut: éteint
    setLamp(false);
  </script>
</body>
</html>
