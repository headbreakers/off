<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Groupe Motard – Connexion</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="login-box">
    <h1>Connexion Motard</h1>
    <input type="text" id="pseudo" placeholder="Pseudo" />
    <input type="password" id="password" placeholder="Mot de passe" />
    <button onclick="login()">Se connecter</button>
    <div class="footer">Groupe motard – privé</div>
  </div>

  <script>
    function login() {
      const pseudo = document.getElementById('pseudo').value;
      const password = document.getElementById('password').value;

      if (pseudo === '' || password === '') {
        alert('Remplis le pseudo et le mot de passe.');
        return;
      }

      // TODO: Ici tu brancheras une vraie auth (serveur / API).
      alert(`Bienvenue ${pseudo} !`);
    }
  </script>
</body>
</html>
